<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중환자실 지박령</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ICU 지박령">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F5F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E171B" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#13232B; --muted:#5A6A72; --line:#D5DDE0;
  --accent:#0B6A77; --accent-soft:#E0EFF0;
  --sans:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E171B; --surface:#152229; --ink:#E3ECEE; --muted:#93A4AB; --line:#293A42;
  --accent:#5EC0C8; --accent-soft:#16383C; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
  padding:calc(env(safe-area-inset-top) + 28px) max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 28px) max(18px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand img{width:44px;height:44px;border-radius:12px}
h1{font-size:26px;letter-spacing:-.6px;margin:0}
.tag{color:var(--muted);font-size:14.5px;margin:6px 0 26px}
.tag b{color:var(--accent)}
.cards{display:grid;gap:12px}
a.card{display:flex;align-items:center;gap:16px;padding:18px;border-radius:18px;background:var(--surface);
  border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .12s}
a.card:active{transform:scale(.98)}
.ic{flex:0 0 52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center}
.ic svg{width:28px;height:28px}
.t{font-size:17px;font-weight:700;letter-spacing:-.3px}
.d{font-size:13.5px;color:var(--muted);margin-top:2px}
.chev{margin-left:auto;color:var(--muted);flex:0 0 auto}
footer{margin-top:34px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="icon-192.png" alt="" style="width:52px;height:52px;border-radius:14px">
    <h1>중환자실 지박령</h1>
  </div>
  <p class="tag">중환자실에서 바로 꺼내 쓰는 임상 도구 · <b>암기 없는 의학</b></p>

  <div class="cards">
    <a class="card" href="vent/index.html">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14h4l2-6 3 10 3-14 2 10h6"/></svg></div>
      <div><div class="t">Vent 파형 도감</div><div class="d">압력·유량·용적 파형의 이상 패턴과 원인, 대처</div></div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="card" href="sedation/index.html">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="4"/><path d="M12 8v8"/></svg></div>
      <div><div class="t">ICU 진정·진통 선택기</div><div class="d">상황별 진정·진통 약물 선택과 주입 속도</div></div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="card" href="weaning/index.html">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v7"/><path d="M8 7c-3 1-5 4-5 8 0 3 2 5 4 5s3-2 3-4v-6"/><path d="M16 7c3 1 5 4 5 8 0 3-2 5-4 5s-3-2-3-4v-6"/></svg></div>
      <div><div class="t">Weaning 프로토콜</div><div class="d">인공호흡기 이탈 평가 단계별 체크</div></div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <footer>
    의료인 교육·학습용 도구이며, 개별 환자의 진단과 치료는 담당 의료진의 판단에 따릅니다.<br>

  </footer>
</div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
